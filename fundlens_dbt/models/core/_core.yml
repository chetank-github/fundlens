version: 2

models:
  - name: dim_scheme
    description: Mutual fund schemes with history of name/category changes (SCD2)
    columns:
      - name: scheme_sk
        data_tests: [unique, not_null]
      - name: scheme_code
        data_tests: [not_null]
      - name: plan_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Direct', 'Regular']
  - name: fct_nav_daily
    description: Daily NAV per tracked scheme (AMFI wins when both sources have the day)
    columns:
      - name: scheme_code
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_scheme')
                field: scheme_code
      - name: nav_date
        data_tests: [not_null]
      - name: nav
        data_tests: [not_null]
