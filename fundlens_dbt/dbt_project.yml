name: fundlens
version: "1.0.0"
profile: fundlens

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  risk_free_rate: 0.065     # yearly risk-free rate used for Sharpe ratio
  spike_threshold: 0.15     # a 15%+ jump that reverses next day = bad data

models:
  fundlens:
    staging:
      +schema: staging
      +materialized: view
    core:
      +schema: core
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table
